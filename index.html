<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines</title>

    <style>
        body {
            background-color: #1F0039;
            color: white;
        }

        
        #hit {
            background-color: #5CFF6D;
            color: #02580C;
        
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        
            width: 200px;
            height: 80px;
            border-radius: 15px;
        
            font-size: 24px;
            cursor: pointer;
        
            animation: pulse 1.5s ease-in-out infinite;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        
        #hit:active {

            width: 175px;
            height: 60px;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: translate(-35%, -35%) scale(1);
            }
        
            50% {
                transform: translate(-35%, -35%) scale(1.15);
            }
        }


      
    </style>
</head>
<body>
    <button id="hit", onclick="goToPage()">Start Game</button>
    <header>
        <!-- Header content -->
    </header>

    <main>
        <!-- Main content -->
    </main>

    <footer>
        <!-- Footer content -->
    </footer>

    <script>

        function goToPage() {
            window.location.href = "game.html";
        }

    </script>
</body>
</html>

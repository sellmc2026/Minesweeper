<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            background-color: #1F0039;
            color: white;
        }

        
        #hit {
            background-color: #642F91;
            color: white;
        
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        
            width: 200px;
            height: 80px;
            border-radius: 15px;
        
            font-size: 24px;
            cursor: pointer;
        
            animation: pulse 1.5s ease-in-out infinite;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        
        #hit:active {
            background-color: #9844E0;
            color: #C785FF;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
        
            50% {
                transform: translate(-50%, -50%) scale(1.15);
            }
        }


      
    </style>
</head>
<body>
    <button id="hit">Start Game</button>
    <header>
        <!-- Header content -->
    </header>

    <main>
        <!-- Main content -->
    </main>

    <footer>
        <!-- Footer content -->
    </footer>

    <script>

        
        const hitBTN = document.getElementById("hit");
        
        hitBTN.addEventListener("click", async () => {
        
            let randomInt = Math.floor(Math.random() * 13) + 1;
            hitBTN.textContent = randomInt;

            hitBTN.disabled = true;

            await new Promise(resolve => setTimeout(resolve, 1753));
            
            hitBTN.disabled = false;
            hitBTN.textContent = "Hit";
        });

    </script>
</body>
</html>

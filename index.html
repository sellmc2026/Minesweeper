<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            background-color: #1F0039;
            color: white;
        }

        #hit:active {
            background-color: #9844E0;
            color: #C785FF;
        }
        #hit {
            transition: background-color 0.2s ease;
            background-color: #642F91;
            color: white;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 200px;
            height: 80px;
            border-radius: 15px;

            font-size: 24px;
            cursor: pointer;
        }
      
    </style>
</head>
<body>
    <button id="hit">Hit</button>
    
    <header>
        <!-- Header content -->
    </header>

    <main>
        <!-- Main content -->
    </main>

    <footer>
        <!-- Footer content -->
    </footer>

    <script>
        
        const button = document.getElementById("hit");
        
        button.addEventListener("click", async () => {
        
            let randomInt = Math.floor(Math.random() * 13) + 1;
            button.textContent = randomInt;

            await new Promise(resolve => setTimeout(resolve, 1753));

            button.textContent = "Hit";
        });

    </script>
</body>
</html>

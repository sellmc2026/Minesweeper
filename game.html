
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines</title>

    <style>
        body {
            background-color: #1F0039;
            color: white;
            margin: 0;
        }

        
        .minefield {
            background-color: #550598;
        
            width: 520px;
            height: 520px;
            padding: 20px;
        
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        
            display: grid;
            grid-template-columns: repeat(5, 100px);
            grid-template-rows: repeat(5, 100px);
        
            justify-content: center;
            align-content: center;
            gap: 10px;
        
            border-radius: 20px;
        }


        .slot {
            background-color: #9F69CD;
            color: #02580C;

            width: 60;
            height: 60;
            border-radius: 20px;
            border: 4px solid transparent;
            border-image: linear-gradient(135deg, #E0E0E0, #F5F5F5, #9E9E9E, #CCCCCC, #FFFFFF) 1;

            font-size: 24px;
            cursor: pointer;

            transition: transform 0.15s ease;
        }

        .slot:active {
            transform: scale(0.875);
        }
    </style>
</head>

<body>
    <div class="minefield" id="minefield"></div>

    <script>
        const minefield = document.getElementById("minefield");

        for (let i = 0; i < 25; i++) {
            const slot = document.createElement("button");

            slot.className = "slot";
            slot.textContent = "";

            minefield.appendChild(slot);
        }
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines</title>

    <style>
        body {
            background-color: #1F0039;
            color: white;
            margin: 0;
        }

        .minefield {
            background-color: #550598;

            width: 500px;
            height: 500px;
            padding: 20px;
            box-sizing: border-box;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);

            gap: 10px;
            border-radius: 20px;
        }

        .slot {
            background-color: #9F69CD;
            color: #02580C;

            width: 110%;
            height: 110%;
            min-width: 0;
            min-height: 0;

            border-radius: 15px;
            border: 2px solid transparent;

            background-image:
                linear-gradient(#9F69CD, #9F69CD),
                linear-gradient(
                    135deg,
                    #E0E0E0,
                    #F5F5F5,
                    #9E9E9E,
                    #CCCCCC,
                    #FFFFFF
                );

            background-origin: border-box;
            background-clip: padding-box, border-box;

            font-size: 24px;
            cursor: pointer;

            transition: transform 0.15s ease;
        }

        .slot:active {
            transform: scale(0.875);
        }
    </style>
</head>

<body>
    <div class="minefield" id="minefield"></div>

    <script>
        const minefield = document.getElementById("minefield");

        for (let i = 0; i < 25; i++) {
            const slot = document.createElement("button");

            slot.className = "slot";
            slot.textContent = "";

            minefield.appendChild(slot);
        }
    </script>
</body>
</html>
